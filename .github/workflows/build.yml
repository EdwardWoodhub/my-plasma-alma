name: Build Plasma OS and Release Live ISO

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "33 20 * * *" # 每天 UTC 20:33 (对应北京时间 CST 04:33)
  workflow_dispatch:
    inputs:
      release_iso:
        description: '是否构建并发布 Live ISO'
        required: true
        type: boolean
        default: true

env:
  IMAGE_NAME: my-plasma-alma-vm
  ISO_NAME: my-plasma-alma-live

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # GitHub Release 发布所需权限
      packages: write       # GHCR 推送所需权限
      id-token: write       # Cosign 签名必需权限

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Checkout repository
        uses: actions/checkout@v4

      # 将 GitHub 用户名/组织名强制转换为纯小写，防止 Podman 推送因大写字符报错
      - name: Set lower case registry name & tags
        id: vars
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          TAG_DATE=$(date +'%Y%m%d')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RELEASE_TAG="${TAG_DATE}-${SHORT_SHA}"
          
          echo "REGISTRY=ghcr.io/${ACTOR_LOWER}" >> $GITHUB_ENV
          echo "ACTOR_LOWER=${ACTOR_LOWER}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Install ORAS CLI (OCI Artifacts Tool)
        uses: oras-project/setup-oras@v1

      # -----------------------------------------------------------------------
      # 1. 登录 GHCR
      # -----------------------------------------------------------------------
      - name: Log into GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ env.ACTOR_LOWER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 2. 构建并推送 Plasma Bootc 容器镜像
      # -----------------------------------------------------------------------
      - name: Build image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          containerfiles: |
            ./Containerfile

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          registry: ${{ env.REGISTRY }}

      - name: Sign image with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      # -----------------------------------------------------------------------
      # 3. 构建 Live ISO (针对 AlmaLinux/CentOS bootc 架构)
      # -----------------------------------------------------------------------
      - name: Build Live ISO using bootc-image-builder
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          mkdir -p output
          sudo mkdir -p /var/lib/containers/storage

          # 1. 登录并拉取构建好的本地镜像
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ env.ACTOR_LOWER }}" --password-stdin
          sudo podman pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # 2. 生成基于 bootc 原生的引导/安装 ISO
          # 使用 --type iso 替代 anaconda-iso，无需联网解析旧 RPM 仓库依赖
          echo "Starting bootc-image-builder..."
          sudo podman run \
            --rm \
            --privileged \
            --net host \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v $(pwd)/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs ext4 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # 3. 恢复产物目录权限
          sudo chown -R $USER:$USER output/
          
          # 4. 移动并确认 ISO (bootc 原生 ISO 产物路径在 output/bootiso/install.iso 或 output/image/boot.iso)
          if [ -f output/bootiso/install.iso ]; then
            mv output/bootiso/install.iso ./${{ env.ISO_NAME }}.iso
          elif [ -f output/image/boot.iso ]; then
            mv output/image/boot.iso ./${{ env.ISO_NAME }}.iso
          elif [ -f output/boot.iso ]; then
            mv output/boot.iso ./${{ env.ISO_NAME }}.iso
          else
            find output -name "*.iso" -exec mv {} ./${{ env.ISO_NAME }}.iso \;
          fi

          ls -lh ./${{ env.ISO_NAME }}.iso
      
      
      
      

      # -----------------------------------------------------------------------
      # 4. 生成校验和与 ISO 分卷 (防止超单文件上限 & 适配 Releases)
      # -----------------------------------------------------------------------
      - name: Prepare ISO and Split
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          # 校验完整 ISO
          sha256sum ${{ env.ISO_NAME }}.iso > SHA256SUMS
          
          # 分卷为 1500MB 一个的分卷包 (后缀如 .part-00, .part-01)
          split -b 1500M -d ${{ env.ISO_NAME }}.iso "${{ env.ISO_NAME }}.iso.part-"
          
          # 校验分卷文件
          sha256sum ${{ env.ISO_NAME }}.iso.part-* >> SHA256SUMS

      # -----------------------------------------------------------------------
      # 5. 发布 ISO 分卷与校验和到 GitHub Releases
      # -----------------------------------------------------------------------
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Plasma OS Live ISO (${{ env.RELEASE_TAG }})"
          body: |
            ### AlmaLinux 10 Plasma Live/Installer ISO
            
            **恢复完整 ISO 方法：**
            - **Linux/macOS**:
              ```bash
              cat ${{ env.ISO_NAME }}.iso.part-* >${{ env.ISO_NAME }}.iso
              sha256sum -c SHA256SUMS
              ```
            - **Windows (PowerShell)**:
              ```powershell
              Get-Content ${{ env.ISO_NAME }}.iso.part-* -ReadCount 0 -AsByteStream \vert{} Set-Content${{ env.ISO_NAME }}.iso -AsByteStream
              ```
          files: |
            SHA256SUMS
            ${{ env.ISO_NAME }}.iso.part-*
          generate_release_notes: false

      # -----------------------------------------------------------------------
      # 6. 推送 ISO Blob (OCI Artifact) 到 GHCR
      # -----------------------------------------------------------------------
      - name: Push ISO Artifact to GHCR
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          echo "Pushing Live ISO as OCI Artifact to GHCR..."
          oras push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-iso:latest" \
            "${{ env.ISO_NAME }}.iso:application/x-iso9660-image"

      # -----------------------------------------------------------------------
      # 7. 同步容器镜像与 ISO Artifact 到阿里云 ACR
      # -----------------------------------------------------------------------
      - name: Log in to Aliyun ACR
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Sync Bootc Container Image to Aliyun ACR
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        run: |
          echo "Syncing ${{ env.IMAGE_NAME }}:latest to Aliyun ACR..."
          skopeo copy \
            --src-creds "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:latest

      - name: Push ISO Artifact to Aliyun ACR
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        run: |
          # 登录 ORAS 到 ACR
          oras login "${{ secrets.ALIYUN_ACR_REGISTRY }}" \
            -u "${{ secrets.ALIYUN_ACR_USERNAME }}" \
            -p "${{ secrets.ALIYUN_ACR_PASSWORD }}"

          echo "Pushing Live ISO as OCI Artifact to Aliyun ACR..."
          oras push "${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}-iso:latest" \
            "${{ env.ISO_NAME }}.iso:application/x-iso9660-image"
