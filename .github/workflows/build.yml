name: Build Plasma OS Based On Almalinux 10 Bootc Image 

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "28 20 * * *" # 每天 UTC 20:28 (北京时间 CST 04:28)
  workflow_dispatch:
    inputs:
      build_iso:
        description: "是否构建并发布 Live ISO"
        type: boolean
        default: true

env:
  # OS 系统镜像名（用于系统的 bootc upgrade）
  IMAGE_NAME: my-plasma-alma-vm
  # ISO 专属镜像仓库名，避免覆盖系统基础镜像
  ISO_IMAGE_NAME: my-plasma-alma-vm-iso
  ISO_FILE_NAME: my-plasma-alma-vm

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 设置超时防止卡死
    permissions:
      contents: write       # Release 上传必需权限
      packages: write       # GHCR 推送必需权限
      id-token: write       # Cosign 签名必需权限

    steps:
      # =========================================================================
      # 1. 基础环境清理与准备
      # =========================================================================
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Checkout repository
        uses: actions/checkout@v4

      # 将 GitHub 用户名强制转换为小写，防止 Registry 报错
      - name: Set lower case registry name
        id: registry_case
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/${ACTOR_LOWER}" >> $GITHUB_ENV
          echo "ACTOR_LOWER=${ACTOR_LOWER}" >> $GITHUB_ENV

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0

      # =========================================================================
      # 2. 登录容器仓库 (GHCR & 阿里云 ACR)
      # =========================================================================
      - name: Log into GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ env.ACTOR_LOWER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # =========================================================================
      # 3. 构建并推送基础 OS 容器镜像到 GHCR
      # =========================================================================
      - name: Build image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          containerfiles: |
            ./Containerfile

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          registry: ${{ env.REGISTRY }}

      - name: Sign image with Cosign
        if: env.COSIGN_PRIVATE_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      # =========================================================================
      # 4a. 修改基础镜像中的 yum repo 文件（关键修复）
      # bootc-image-builder 的 config.json repositories 配置只影响额外仓库，
      # 不影响 BaseOS/AppStream 等系统基础仓库。基础仓库的镜像源由镜像内部
      # /etc/yum.repos.d/ 中的 repo 文件决定，必须直接修改镜像内容。
      # =========================================================================
      - name: Patch base image repo mirrors (fix mirror unreachable)
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          echo "=== Patching base image repo mirrors ==="

          # 确保 root 用户已登录 GHCR（用于拉取镜像）
          sudo podman login ghcr.io -u "${{ env.ACTOR_LOWER }}" -p "${{ secrets.GITHUB_TOKEN }}"

          # 创建 BaseOS repo 文件（宿主机临时文件）
          cat > /tmp/BaseOS.repo << 'REPOEOF'
          [baseos]
          name=AlmaLinux BaseOS 10 - x86_64
          baseurl=https://repo.almalinux.org/almalinux/10/BaseOS/x86_64/os/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=6h
          REPOEOF

          # 创建 AppStream repo 文件（宿主机临时文件）
          cat > /tmp/AppStream.repo << 'REPOEOF'
          [appstream]
          name=AlmaLinux AppStream 10 - x86_64
          baseurl=https://repo.almalinux.org/almalinux/10/AppStream/x86_64/os/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          metadata_expire=6h
          REPOEOF

          # 从基础镜像创建临时容器（不启动）
          echo "Creating temporary container..."
          sudo podman create --name patch_tmp "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" sleep infinity

          # 先启动容器（后续 exec 命令需要容器运行中）
          echo "Starting container..."
          sudo podman start patch_tmp

          # 删除镜像中原有的所有 .repo 文件（先删旧的，再复制新的）
          echo "Removing existing repo files..."
          sudo podman exec patch_tmp rm -f /etc/yum.repos.d/*.repo 2>/dev/null || true

          # 复制新的 repo 文件到容器中
          echo "Copying new repo files..."
          sudo podman cp /tmp/BaseOS.repo patch_tmp:/etc/yum.repos.d/BaseOS.repo
          sudo podman cp /tmp/AppStream.repo patch_tmp:/etc/yum.repos.d/AppStream.repo

          # 验证文件已写入
          echo "Verifying new repo files:"
          sudo podman exec patch_tmp cat /etc/yum.repos.d/BaseOS.repo
          sudo podman exec patch_tmp cat /etc/yum.repos.d/AppStream.repo
          echo "Repo files in directory:"
          sudo podman exec patch_tmp ls -la /etc/yum.repos.d/

          # 停止容器
          echo "Stopping container..."
          sudo podman stop patch_tmp 2>/dev/null || true

          # 提交修改后的镜像（覆盖 latest 标签）
          echo "Committing patched image..."
          sudo podman commit patch_tmp "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # 清理临时容器
          sudo podman rm patch_tmp 2>/dev/null || true

          echo "=== Base image repo mirrors patched successfully ==="


      # =========================================================================
      # 3.5. 预拉取 bootc-image-builder 镜像（应对 quay.io CDN 抖动）
      # =========================================================================
      - name: Pre-pull bootc-image-builder image (aggressive retry)
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          echo "=== Pre-pulling bootc-image-builder image ==="
          echo "quay.io CDN may be unstable; this step retries up to 5 times"
          MAX_RETRIES=5
          RETRY_COUNT=0
          PULL_SUCCESS=false
          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ] && [ "$PULL_SUCCESS" = "false" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Pre-pull attempt $RETRY_COUNT of $MAX_RETRIES ==="
            if sudo podman pull quay.io/centos-bootc/bootc-image-builder:latest; then
              PULL_SUCCESS=true
              echo "=== Pre-pull successful! Image cached for build step ==="
            else
              echo "WARNING: Pre-pull failed (attempt $RETRY_COUNT/$MAX_RETRIES)"
              if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                WAIT_TIME=$((RETRY_COUNT * 45))
                echo "Waiting $WAIT_TIME seconds before retry..."
                sleep "$WAIT_TIME"
              else
                echo "ERROR: Pre-pull failed after $MAX_RETRIES attempts"
                echo "quay.io CDN may be experiencing an outage."
                echo "Please wait a few minutes and re-run this workflow."
                exit 1
              fi
            fi
          done
          echo "Verifying image is cached locally..."
          sudo podman image inspect quay.io/centos-bootc/bootc-image-builder:latest > /dev/null 2>&1 && echo "Image verified locally!" || echo "WARNING: Image may not be fully cached, build step will retry"
      # =========================================================================
      # 4. 构建 Live ISO (bootc-image-builder)
      # =========================================================================
      - name: Build Live ISO with bootc-image-builder
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          mkdir -p output

          # 1. 宿主机 root 登录 GHCR
          sudo podman login ghcr.io -u "${{ env.ACTOR_LOWER }}" -p "${{ secrets.GITHUB_TOKEN }}"

          # 2. 确保基础镜像在 root 容器存储中可用
          # 注意：如果 "Patch base image repo mirrors" 步骤成功执行，
          # 镜像已经被拉取并打标签为 latest，此处无需重复拉取。
          # 仅在镜像被清理的极端情况下才需要手动拉取（会丢失 Patch 修改）。
          echo "Checking if base image is available locally..."
          if ! sudo podman image inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" > /dev/null 2>&1; then
            echo "Image not found locally (may have been evicted), pulling from registry..."
            sudo podman pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            echo "WARNING: Image was re-pulled from registry. The repo mirror patches may be lost."
            echo "Consider re-running this job to apply patches from scratch."
          else
            echo "Base image already available locally."
          fi

          # 3. 写入 bootc-image-builder 配置文件
          # 注意：config.json 中的 repositories 配置只影响额外仓库的添加，
          # 不影响系统基础仓库（BaseOS/AppStream）的镜像源。
          # 基础仓库镜像源已通过 "Patch base image repo mirrors" 步骤修改。
          cat > config.json << 'EOF'
          {
            "customizations": {}
          }
          EOF
          echo "config.json content:"
          cat config.json

          # 4. 设置 librepo 超时参数（增加超时时间应对网络波动）
          # LIBREPO_TIMEOUT: 每个镜像尝试的最大等待时间(秒)
          # LIBREPO_MAX_MIRROR_TRIES: 每个镜像最大重试次数
          # 注意：这些变量必须通过 podman run --env 显式传入容器内部才能生效
          export LIBREPO_TIMEOUT=60
          export LIBREPO_MAX_MIRROR_TRIES=10

          echo "Librepo settings: TIMEOUT=$LIBREPO_TIMEOUT MAX_TRIES=$LIBREPO_MAX_MIRROR_TRIES"

          # 5. 运行构建器（带重试机制，应对 quay.io CDN 临时抖动和镜像源不可达）
          echo "Running bootc-image-builder... (with retry)"
          MAX_RETRIES=5
          RETRY_COUNT=0
          BUILD_SUCCESS=false

          while [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ] && [ "$BUILD_SUCCESS" = "false" ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "=== Attempt $RETRY_COUNT of $MAX_RETRIES ==="

            # 使用 --env 显式传递 librepo 环境变量到容器内部
            # 注意：sudo 可能会清除自定义环境变量，所以必须用 --env 显式传入
            if sudo podman run \
              --rm \
              --privileged \
              --net=host \
              --security-opt label=type:unconfined_t \
              --env LIBREPO_TIMEOUT=$LIBREPO_TIMEOUT \
              --env LIBREPO_MAX_MIRROR_TRIES=$LIBREPO_MAX_MIRROR_TRIES \
              -v ./output:/output \
              -v ./config.json:/config.json:ro \
              -v /var/lib/containers/storage:/var/lib/containers/storage \
              quay.io/centos-bootc/bootc-image-builder:latest \
              --config /config.json \
              --type anaconda-iso \
              --rootfs ext4 \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"; then
              BUILD_SUCCESS=true
            else
              echo "WARNING: bootc-image-builder failed (attempt $RETRY_COUNT/$MAX_RETRIES)"
              if [ "$RETRY_COUNT" -lt "$MAX_RETRIES" ]; then
                WAIT_TIME=$((RETRY_COUNT * 45))
                echo "Waiting $WAIT_TIME seconds before retry..."
                sleep "$WAIT_TIME"
              else
                echo "ERROR: bootc-image-builder failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

          # 6. 提取生成的 ISO 并重命名
          ISO_FILE=$(find output -name "*.iso" 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "Error: 未在 output 目录中找到生成的 ISO！"
            exit 1
          fi

          echo "Found ISO: $ISO_FILE"
          sudo mv "$ISO_FILE" "./${{ env.ISO_FILE_NAME }}.iso"
          # 确保当前用户有权读取该文件用于后续步骤
          sudo chmod 644 "./${{ env.ISO_FILE_NAME }}.iso"
          ls -lh "${{ env.ISO_FILE_NAME }}.iso"

      # =========================================================================
      # 5. 切割 ISO 并推送到 GitHub Releases
      # =========================================================================
      - name: Split ISO & Generate Checksum
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          ISO_SIZE=$(stat -c%s "${{ env.ISO_FILE_NAME }}.iso" 2>/dev/null || echo 0)
          # 如果文件大于 1800MB，则切割；否则直接上传原文件
          if [ "$ISO_SIZE" -gt 1887436800 ]; then
            split -b 1800M "${{ env.ISO_FILE_NAME }}.iso" "${{ env.ISO_FILE_NAME }}.iso.part-"
            echo "ISO_SPLIT=true" >> $GITHUB_ENV
          else
            echo "ISO file size (${ISO_SIZE} bytes) is under 1800MB, skipping split."
            echo "ISO_SPLIT=false" >> $GITHUB_ENV
          fi
          sha256sum "${{ env.ISO_FILE_NAME }}.iso" > "${{ env.ISO_FILE_NAME }}.iso.sha256"

      - name: Publish ISO (small file) to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: (github.event_name != 'workflow_dispatch' || inputs.build_iso == true) && env.ISO_SPLIT != 'true'
        with:
          files: |
            ${{ env.ISO_FILE_NAME }}.iso.sha256
            ${{ env.ISO_FILE_NAME }}.iso
          tag_name: release-${{ github.run_number }}
          name: "Live ISO Build #${{ github.run_number }}"
          generate_release_notes: true

      - name: Publish ISO Parts (large file) to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: (github.event_name != 'workflow_dispatch' || inputs.build_iso == true) && env.ISO_SPLIT == 'true'
        with:
          files: |
            ${{ env.ISO_FILE_NAME }}.iso.sha256
            ${{ env.ISO_FILE_NAME }}.iso.part-*
          tag_name: release-${{ github.run_number }}
          name: "Live ISO Build #${{ github.run_number }}"
          generate_release_notes: true


      # =========================================================================
      # 6. 将 ISO 封装为同一 Package 下的 live-iso Tag 并推送到 GHCR 和 阿里云 ACR
      # =========================================================================
      - name: Package ISO into Container Image & Push
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          # 1. 修复之前 sudo 执行命令残留的权限锁定问题
          sudo chown -R $USER:$USER /run/user/$(id -u)/containers 2>/dev/null || true
          sudo chown -R $USER:$USER /home/runner/.config/containers 2>/dev/null || true

          # 2. 重新用当前用户登录 GHCR，确保认证文件有效
          podman login ghcr.io -u "${{ env.ACTOR_LOWER }}" -p "${{ secrets.GITHUB_TOKEN }}"

          echo "Creating containerfile for ISO packaging..."
          cat << EOF > Containerfile.iso
          FROM scratch
          COPY ${{ env.ISO_FILE_NAME }}.iso /${{ env.ISO_FILE_NAME }}.iso
          EOF

          echo "Building ISO container image with Podman..."
          podman build -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:live-iso" -f Containerfile.iso .

          echo "Pushing ISO container image to GHCR..."
          podman push \
            --creds "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:live-iso"

      - name: Sync ISO Container Image to Aliyun ACR
        if: |
          (github.event_name != 'workflow_dispatch' || inputs.build_iso == true) &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          echo "Logging into Aliyun ACR with podman..."
          podman login ${{ secrets.ALIYUN_ACR_REGISTRY }} \
            -u "${{ secrets.ALIYUN_ACR_USERNAME }}" \
            -p "${{ secrets.ALIYUN_ACR_PASSWORD }}"

          echo "Tagging ISO image for ACR..."
          podman tag \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:live-iso" \
            "${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:live-iso

          echo "Pushing ISO image to ACR directly..."
          podman push "${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:live-iso"
      
      
      
      

      # =========================================================================
      # 7. 统一同步镜像到阿里云 ACR（保留在流水线最后）
      # =========================================================================
      - name: Sync OS Image to Aliyun ACR
        if: steps.push-to-ghcr.outcome == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          echo "Syncing OS image ${{ env.IMAGE_NAME }}:latest to Aliyun ACR from local storage..."
          # 使用 sudo 访问 root 的 containers-storage（因为步骤4a是用 sudo commit 的）
          sudo skopeo copy \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            --retry-times 5 \
            containers-storage:${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:latest

      - name: Sync ISO Container Image to Aliyun ACR
        if: |
          (github.event_name != 'workflow_dispatch' || inputs.build_iso == true) &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          echo "Syncing ISO container image to Aliyun ACR via skopeo..."
          # 清除导致 skopeo 误入 rootless 的环境变量，并显式指定 storage 路径
          sudo env -i \
            PATH="$PATH" \
            HOME="/root" \
            skopeo copy \
              --retry-times 5 \
              --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
              --dest-compress-format gzip \
              --format v2s2 \
              containers-storage:[${{ env.HOME }}/.local/share/containers/storage]${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:live-iso \
              docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:live-iso
      
      
      
      
      # =========================================================================
      # 8. 清理 podman 认证文件权限（修复 logout 权限错误）
      # =========================================================================
      - name: Cleanup podman auth permissions
        if: always()
        run: |
          set +e
          echo "=== Cleaning up podman auth permissions ==="
          # 修复 /run/user/XXX/containers/ 权限（sudo podman login 创建的 root 文件）
          sudo chown -R $USER:$USER /run/user/$(id -u)/containers 2>/dev/null || true
          sudo chown -R $USER:$USER /home/runner/.config/containers 2>/dev/null || true
          # 静默退出（即使失败也不影响流水线状态）
          rm -f /run/user/$(id -u)/containers/auth.json 2>/dev/null || true
          rm -f /home/runner/.config/containers/auth.json 2>/dev/null || true
          echo "=== Cleanup complete ==="

