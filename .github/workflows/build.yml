name: Build Plasma OS Bootc & Live ISO (AlmaLinux 10)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"  
  schedule:
    - cron: "28 20 * * *" # 每天 UTC 20:28 (北京时间 CST 04:28)
  workflow_dispatch:
    inputs:
      build_iso:
        description: "是否构建并发布 Live ISO"
        type: boolean
        default: true

env:
  # OS 系统镜像名（用于 bootc upgrade）
  IMAGE_NAME: my-plasma-alma-vm
  # 关键修改 1：ISO 专属容器仓库名，防止覆盖掉上面的系统基础镜像！
  ISO_IMAGE_NAME: my-plasma-alma-vm-iso
  ISO_FILE_NAME: my-plasma-alma-vm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Release 上传权限
      packages: write       # GHCR 推送权限
      id-token: write       # Cosign 签名权限

    steps:
      # =========================================================================
      # 1. 基础环境清理与准备
      # =========================================================================
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Checkout repository
        uses: actions/checkout@v4

      # 将 GitHub 用户名强制转换为纯小写，防止 Registry 报错
      - name: Set lower case registry name
        id: registry_case
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/${ACTOR_LOWER}" >> $GITHUB_ENV
          echo "ACTOR_LOWER=${ACTOR_LOWER}" >> $GITHUB_ENV

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0

      # =========================================================================
      # 2. 登录容器仓库 (GHCR & 阿里云 ACR)
      # =========================================================================
      - name: Log into GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ env.ACTOR_LOWER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # =========================================================================
      # 3. 构建并推送基础 OS 容器镜像 (用于系统的 bootc upgrade)
      # =========================================================================
      - name: Build image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          containerfiles: |
            ./Containerfile

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          registry: ${{ env.REGISTRY }}

      - name: Sign image with Cosign
        if: env.COSIGN_PRIVATE_KEY != ''
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      

      # =========================================================================
      # 4. 构建 Live ISO (强制指定稳定软件源)
      # =========================================================================
      - name: Build Live ISO with bootc-image-builder
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          mkdir -p output

          # 1. 登录 GHCR
          sudo podman login ghcr.io -u "${{ env.ACTOR_LOWER }}" -p "${{ secrets.GITHUB_TOKEN }}"

          # 2. 提前拉取本地镜像
          echo "Pulling base image to local podman storage..."
          sudo podman pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # 3. 创建构建配置，强制指定稳定的 AlmaLinux 10 官方基础源与仓库
          cat << 'EOF' > config.json
          {
            "customizations": {
              "repositories": [
                {
                  "id": "baseos",
                  "baseurl": "https://repo.almalinux.org/almalinux/10/BaseOS/x86_64/os/",
                  "check_gpg": false
                },
                {
                  "id": "appstream",
                  "baseurl": "https://repo.almalinux.org/almalinux/10/AppStream/x86_64/os/",
                  "check_gpg": false
                }
              ]
            }
          }
          EOF

          # 4. 运行构建器，传入 --config config.json
          echo "Running bootc-image-builder..."
          sudo podman run \
            --rm \
            --privileged \
            --net=host \
            --security-opt label=type:unconfined_t \
            -v ./output:/output \
            -v ./config.json:/config.json:ro \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --config /config.json \
            --type anaconda-iso \
            --rootfs ext4 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # 5. 提取生成的 ISO 并重命名
          ISO_FILE=$(find output -name "*.iso" 2>/dev/null | head -n 1)
          if [ -z "$ISO_FILE" ]; then
            echo "Error: 未在 output 目录中找到生成的 ISO！"
            exit 1
          fi

          echo "Found ISO: $ISO_FILE"
          sudo mv "$ISO_FILE" "./${{ env.ISO_FILE_NAME }}.iso"
          sudo chown -R $USER:$USER "./${{ env.ISO_FILE_NAME }}.iso"
          ls -lh "${{ env.ISO_FILE_NAME }}.iso"
      
      

      # =========================================================================
      # 5. 切割 ISO 并推送到 GitHub Releases
      # =========================================================================
      - name: Split ISO & Generate Checksum
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          split -b 1800M "${{ env.ISO_FILE_NAME }}.iso" "${{ env.ISO_FILE_NAME }}.iso.part-"
          sha256sum "${{ env.ISO_FILE_NAME }}.iso" > "${{ env.ISO_FILE_NAME }}.iso.sha256"

      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        with:
          files: |
            ${{ env.ISO_FILE_NAME }}.iso.part-*
            ${{ env.ISO_FILE_NAME }}.iso.sha256
          tag_name: release-${{ github.run_number }}
          name: "Live ISO Build #${{ github.run_number }}"
          generate_release_notes: true

      # =========================================================================
      # 6. 将 ISO 封装为独立 OCI 镜像容器并推送到 GHCR 和 阿里云 ACR
      # =========================================================================
      - name: Package ISO into Container Image & Push
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          # 1. 修复之前 sudo 执行命令残留的权限锁定问题
          sudo chown -R $USER:$USER /run/user/$(id -u)/containers 2>/dev/null || true
          sudo chown -R $USER:$USER /home/runner/.config/containers 2>/dev/null || true

          # 2. 重新用当前用户登录 GHCR，确保认证文件有效
          podman login ghcr.io -u "${{ env.ACTOR_LOWER }}" -p "${{ secrets.GITHUB_TOKEN }}"

          echo "Creating containerfile for ISO packaging..."
          cat << EOF > Containerfile.iso
          FROM scratch
          COPY ${{ env.ISO_FILE_NAME }}.iso /${{ env.ISO_FILE_NAME }}.iso
          COPY ${{ env.ISO_FILE_NAME }}.iso.sha256 /${{ env.ISO_FILE_NAME }}.iso.sha256
          EOF

          echo "Building ISO container image with Podman..."
          podman build -t "${{ env.REGISTRY }}/${{ env.ISO_IMAGE_NAME }}:latest" -f Containerfile.iso .

          echo "Pushing ISO container image to GHCR..."
          podman push \
            --creds "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" \
            "${{ env.REGISTRY }}/${{ env.ISO_IMAGE_NAME }}:latest"

      - name: Sync ISO Container Image to Aliyun ACR
        if: |
          (github.event_name != 'workflow_dispatch' || inputs.build_iso == true) &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: |
          echo "Syncing ISO container image to Aliyun ACR via skopeo..."
          skopeo copy \
            --src-creds "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://${{ env.REGISTRY }}/${{ env.ISO_IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.ISO_IMAGE_NAME }}:latest
      
      # 同步 OS 镜像到阿里云 ACR
      - name: Sync OCI Image from GHCR to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Syncing ${{ env.IMAGE_NAME }}:latest to Aliyun ACR..."
          skopeo copy \
            --src-creds "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:latest
      
      
