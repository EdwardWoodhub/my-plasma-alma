name: Build Plasma OS and Release Live ISO

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "33 20 * * *" # 每天 UTC 20:33 (对应北京时间 CST 04:33)[cite: 1]
  workflow_dispatch:
    inputs:
      release_iso:
        description: '是否构建并发布 Live ISO'
        required: true
        type: boolean
        default: true

env:
  IMAGE_NAME: my-plasma-alma-vm
  ISO_NAME: my-plasma-alma-live

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 发布 GitHub Release 所需权限
      packages: write       # 推送 GHCR 所需权限[cite: 1]
      id-token: write       # Cosign 签名必需权限[cite: 1]

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7[cite: 1]

      - name: Checkout repository
        uses: actions/checkout@v4[cite: 1]

      # 将 GitHub 用户名/组织名强制转换为纯小写，防止 Podman 推送因大写字符报错
      - name: Set lower case registry name & tags
        id: vars
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          TAG_DATE=$(date +'%Y%m%d')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RELEASE_TAG="${TAG_DATE}-${SHORT_SHA}"
          
          echo "REGISTRY=ghcr.io/${ACTOR_LOWER}" >> $GITHUB_ENV
          echo "ACTOR_LOWER=${ACTOR_LOWER}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0[cite: 1]

      - name: Install ORAS CLI (OCI Artifacts Tool)
        uses: oras-project/setup-oras@v1

      # -----------------------------------------------------------------------
      # 1. 登录 GHCR
      # -----------------------------------------------------------------------
      - name: Log into GitHub Container Registry
        uses: redhat-actions/podman-login@v1[cite: 1]
        with:
          registry: ghcr.io[cite: 1]
          username: ${{ env.ACTOR_LOWER }}[cite: 1]
          password: ${{ secrets.GITHUB_TOKEN }}[cite: 1]

      # -----------------------------------------------------------------------
      # 2. 构建并推送 Plasma Bootc 容器镜像
      # -----------------------------------------------------------------------
      - name: Build image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2[cite: 1]
        with:
          image: ${{ env.IMAGE_NAME }}[cite: 1]
          tags: latest[cite: 1]
          containerfiles: |
            ./Containerfile

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v2[cite: 1]
        with:
          image: ${{ env.IMAGE_NAME }}[cite: 1]
          tags: latest[cite: 1]
          registry: ${{ env.REGISTRY }}[cite: 1]

      - name: Sign image with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}[cite: 1]
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"[cite: 1]

      # -----------------------------------------------------------------------
      # 3. 使用 bootc-iso-installer 构建 Live/Installer ISO
      #    自带完整引导环境，不联网解析外部 RPM 依赖，避免 404 镜像源报错
      # -----------------------------------------------------------------------
      - name: Build Live ISO using bootc-iso-installer
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          mkdir -p output

          echo "Starting bootc-iso-installer..."
          sudo podman run \
            --rm \
            --privileged \
            --net host \
            -v $(pwd)/output:/build-container-installer/build \
            ghcr.io/ublue-os/bootc-iso-installer:latest \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

          # 恢复产物目录权限给 Actions runner
          sudo chown -R $USER:$USER output/

          # 查找生成的 ISO 并统一重命名
          ISO_FILE=$(find output -maxdepth 1 -name "*.iso" | head -n 1)
          if [ -n "$ISO_FILE" ]; then
            mv "$ISO_FILE" ./${{ env.ISO_NAME }}.iso
          else
            echo "Error: ISO not found in output directory!"
            exit 1
          fi

          ls -lh ./${{ env.ISO_NAME }}.iso

      # -----------------------------------------------------------------------
      # 4. 生成校验和与 ISO 分卷 (防止超单文件上限 & 方便网络下载)
      # -----------------------------------------------------------------------
      - name: Prepare ISO and Split
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          # 校验完整 ISO
          sha256sum ${{ env.ISO_NAME }}.iso > SHA256SUMS
          
          # 分卷为 1500MB 一个的分卷包 (后缀如 .part-00, .part-01)[cite: 2]
          split -b 1500M -d ${{ env.ISO_NAME }}.iso "${{ env.ISO_NAME }}.iso.part-"[cite: 2]
          
          # 校验分卷文件
          sha256sum ${{ env.ISO_NAME }}.iso.part-* >> SHA256SUMS

      # -----------------------------------------------------------------------
      # 5. 发布 ISO 分卷与校验和到 GitHub Releases
      # -----------------------------------------------------------------------
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2[cite: 2]
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)[cite: 2]
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Plasma OS Live ISO (${{ env.RELEASE_TAG }})"
          body: |
            ### AlmaLinux 10 Plasma Live/Installer ISO
            
            **恢复完整 ISO 方法：**
            - **Linux/macOS**:
              ```bash
              cat ${{ env.ISO_NAME }}.iso.part-* >${{ env.ISO_NAME }}.iso
              sha256sum -c SHA256SUMS
              ```
            - **Windows (PowerShell)**:
              ```powershell
              Get-Content ${{ env.ISO_NAME }}.iso.part-* -ReadCount 0 -AsByteStream \vert{} Set-Content${{ env.ISO_NAME }}.iso -AsByteStream
              ```
          files: |
            SHA256SUMS
            ${{ env.ISO_NAME }}.iso.part-*
          generate_release_notes: false

      # -----------------------------------------------------------------------
      # 6. 推送 ISO Blob (OCI Artifact) 到 GHCR
      # -----------------------------------------------------------------------
      - name: Push ISO Artifact to GHCR
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          echo "Pushing Live ISO as OCI Artifact to GHCR..."
          oras push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-iso:latest" \
            "${{ env.ISO_NAME }}.iso:application/x-iso9660-image"

      # -----------------------------------------------------------------------
      # 7. 登录并同步容器镜像与 ISO Artifact 到阿里云 ACR
      # -----------------------------------------------------------------------
      - name: Log in to Aliyun ACR
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        uses: redhat-actions/podman-login@v1[cite: 1]
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}[cite: 1]
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}[cite: 1]
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}[cite: 1]

      - name: Sync Bootc Container Image to Aliyun ACR
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        run: |
          echo "Syncing ${{ env.IMAGE_NAME }}:latest to Aliyun ACR..."[cite: 1]
          skopeo copy \
            --src-creds "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:latest[cite: 1]

      - name: Push ISO Artifact to Aliyun ACR
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'schedule'
        run: |
          oras login "${{ secrets.ALIYUN_ACR_REGISTRY }}" \
            -u "${{ secrets.ALIYUN_ACR_USERNAME }}" \
            -p "${{ secrets.ALIYUN_ACR_PASSWORD }}"

          echo "Pushing Live ISO as OCI Artifact to Aliyun ACR..."
          oras push "${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}-iso:latest" \
            "${{ env.ISO_NAME }}.iso:application/x-iso9660-image"
