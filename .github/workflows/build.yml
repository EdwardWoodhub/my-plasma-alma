name: Build Plasma OS Based on AlmaLinux 10 Bootc Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "33 20 * * *" # 每天 UTC 20:33 (对应北京时间 CST 04:33)[cite: 1]
  workflow_dispatch:
    inputs:
      build_iso:
        description: "是否构建并发布 Live ISO"
        type: boolean
        default: true

env:
  IMAGE_NAME: my-plasma-alma-vm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Cosign 签名必需权限[cite: 1]

    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7[cite: 1]

      - name: Checkout repository
        uses: actions/checkout@v4[cite: 1]

      # 将 GitHub 用户名/组织名强制转换为纯小写，防止 Registry 因大写报错[cite: 1]
      - name: Set lower case registry name
        id: registry_case
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/${ACTOR_LOWER}" >> $GITHUB_ENV
          echo "ACTOR_LOWER=${ACTOR_LOWER}" >> $GITHUB_ENV

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0[cite: 1]

      # 安装 ORAS CLI 用于将 ISO 作为 OCI Artifact 推送
      - name: Install ORAS CLI
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Log into GitHub Container Registry
        uses: redhat-actions/podman-login@v1[cite: 1]
        with:
          registry: ghcr.io[cite: 1]
          username: ${{ env.ACTOR_LOWER }}[cite: 1]
          password: ${{ secrets.GITHUB_TOKEN }}[cite: 1]

      # 带有网络容错与重试的 Buildah 构建，解决 Quay.io 偶发 EOF 问题
      - name: Build image using Buildah
        run: |
          echo "Starting build with retry logic..."
          for i in {1..5}; do
            echo "Build attempt $i..."
            if buildah bud \
              --isolation=chroot \
              -t "${{ env.IMAGE_NAME }}:latest" \
              -f ./Containerfile .; then
              echo "Build succeeded!"
              break
            fi
            echo "Build failed on attempt $i (possible Quay CDN EOF), retrying in 15s..."
            sleep 15
            if [ $i -eq 5 ]; then
              echo "Build failed after 5 attempts."
              exit 1
            fi
          done

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v2[cite: 1]
        with:
          image: ${{ env.IMAGE_NAME }}[cite: 1]
          tags: latest[cite: 1]
          registry: ${{ env.REGISTRY }}[cite: 1]

      - name: Sign image with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}[cite: 1]
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"[cite: 1]

      # =========================================================================
      # 1. 登录阿里云 ACR
      # =========================================================================
      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'[cite: 1]
        uses: redhat-actions/podman-login@v1[cite: 1]
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}[cite: 1]
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}[cite: 1]
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}[cite: 1]

      # =========================================================================
      # 2. 同步容器镜像到阿里云 ACR
      # =========================================================================
      - name: Sync OCI Image from GHCR to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'[cite: 1]
        run: |
          echo "Syncing ${{ env.IMAGE_NAME }}:latest to Aliyun ACR..."[cite: 1]
          skopeo copy \
            --src-creds "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:latest[cite: 1]

      # =========================================================================
      # 3. 构建可引导 ISO（从已推送到 GHCR 的镜像拉取，避开本地 root 权限隔离）
      # =========================================================================
      - name: Build bootc ISO
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          mkdir -p output
          
          # 创建用于 pull 私有 GHCR 镜像的临时凭据文件
          mkdir -p auth_dir
          cat <<EOF > auth_dir/auth.json
          {
            "auths": {
              "ghcr.io": {
                "auth": "$(echo -n "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" | base64 -w 0)"
              }
            }
          }
          EOF

          echo "Running bootc-image-builder..."
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            -v ./output:/output \
            -v $(pwd)/auth_dir/auth.json:/run/containers/0/auth.json:ro \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # 清理凭据并将 ISO 提取到当前工作目录
          rm -rf auth_dir
          sudo chown -R $USER:$USER output/
          mv output/bootiso/install.iso ./${{ env.IMAGE_NAME }}.iso
          ls -lh ./${{ env.IMAGE_NAME }}.iso

      # =========================================================================
      # 4. 使用 ORAS 将 ISO 作为 OCI Artifact 推送到 GHCR
      # =========================================================================
      - name: Push ISO Artifact to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.build_iso == true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ env.ACTOR_LOWER }}" --password-stdin

          echo "Pushing ISO to GHCR..."
          oras push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-iso:latest" \
            --annotation "org.opencontainers.image.title=${{ env.IMAGE_NAME }}.iso" \
            ./${{ env.IMAGE_NAME }}.iso:application/vnd.efi.iso

      # =========================================================================
      # 5. 使用 ORAS 将 ISO 作为 OCI Artifact 推送到 阿里云 ACR
      # =========================================================================
      - name: Push ISO Artifact to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build_iso == true) || github.event_name == 'schedule'
        run: |
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | oras login "${{ secrets.ALIYUN_ACR_REGISTRY }}" -u "${{ secrets.ALIYUN_ACR_USERNAME }}" --password-stdin

          echo "Pushing ISO to Aliyun ACR..."
          oras push "${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}-iso:latest" \
            --annotation "org.opencontainers.image.title=${{ env.IMAGE_NAME }}.iso" \
            ./${{ env.IMAGE_NAME }}.iso:application/vnd.efi.iso
