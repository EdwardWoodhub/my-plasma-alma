name: Build Plasma OS Based on AlmaLinux 10 Bootc Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "33 20 * * *" # 每天 UTC 20:33 (对应北京时间 CST 04:33)
  workflow_dispatch:
    inputs:
      release_iso:
        description: "是否发布 LiveISO 到 Release 及推送 Blob"
        required: true
        type: boolean
        default: true

env:
  IMAGE_NAME: my-plasma-alma-vm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # GitHub Release 上传必需权限
      packages: write       # GHCR 推送必需权限
      id-token: write       # Cosign 签名必需权限

    steps:
      # =========================================================================
      # 0. 环境清理与检出
      # =========================================================================
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (xorriso, mksquashfs)
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools mtools dosfstools

      - name: Set lower case registry name & dynamic tags
        id: vars
        run: |
          ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/${ACTOR_LOWER}" >> $GITHUB_ENV
          echo "ACTOR_LOWER=${ACTOR_LOWER}" >> $GITHUB_ENV
          
          RELEASE_TAG="live-$(date +'%Y%m%d-%H%M%S')"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

      - name: Install Cosign (Sigstore)
        uses: sigstore/cosign-installer@v3.5.0

      - name: Setup ORAS (用于推送 ISO Blob 到 OCI 仓库)
        uses: oras-project/setup-oras@v1

      # =========================================================================
      # 1. 登录容器仓库 (GHCR & Aliyun ACR)
      # =========================================================================
      - name: Log into GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ env.ACTOR_LOWER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      # =========================================================================
      # 2. 构建并推送 OS 容器镜像
      # =========================================================================
      - name: Build image using Buildah
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          containerfiles: |
            ./Containerfile

      - name: Push to GHCR
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: latest
          registry: ${{ env.REGISTRY }}

      - name: Sign image with Cosign
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

      - name: Sync OCI Image from GHCR to Aliyun ACR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          echo "Syncing ${{ env.IMAGE_NAME }}:latest to Aliyun ACR..."
          skopeo copy \
            --src-creds "${{ env.ACTOR_LOWER }}:${{ secrets.GITHUB_TOKEN }}" \
            --dest-creds "${{ secrets.ALIYUN_ACR_USERNAME }}:${{ secrets.ALIYUN_ACR_PASSWORD }}" \
            --dest-compress-format gzip \
            --format v2s2 \
            docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            docker://${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}:latest

      # =========================================================================
      # 3. 制作原生免安装 Plasma LiveCD ISO
      # =========================================================================
      - name: Generate Native Plasma LiveCD ISO
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          mkdir -p output
          WORKDIR=$(pwd)/live_workspace
          mkdir -p ${WORKDIR}/{rootfs,iso/LiveOS,iso/isolinux,iso/EFI/BOOT}
          
          echo "=== 1. 从构建好的本地镜像中导出 Rootfs ==="
          CONTAINER_ID=$(podman create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest)
          podman export ${CONTAINER_ID} | tar -x -C ${WORKDIR}/rootfs/
          podman rm ${CONTAINER_ID}

          echo "=== 2. 定位内核版本并提取内核 ==="
          # bootc / ostree 架构下，内核在 /usr/lib/modules/<version>/vmlinuz
          KERNEL_DIR=$(ls -d ${WORKDIR}/rootfs/usr/lib/modules/* | head -n 1)
          KERNEL_VERSION=$(basename "${KERNEL_DIR}")
          echo "检测到内核版本: ${KERNEL_VERSION}"

          # 寻找 vmlinuz 路径（兼容 /boot 或 /usr/lib/modules）
          if [ -f "${KERNEL_DIR}/vmlinuz" ]; then
            VMLINUZ="${KERNEL_DIR}/vmlinuz"
          else
            VMLINUZ=$(find ${WORKDIR}/rootfs/boot -name "vmlinuz*" | head -n 1)
          fi
          cp "${VMLINUZ}" ${WORKDIR}/iso/isolinux/vmlinuz

          echo "=== 3. 容器内现场构建 LiveCD 专属 initramfs (集成 dmsquash-live 模块) ==="
          sudo podman run --rm --privileged \
            -v ${WORKDIR}/iso/isolinux:/out \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            bash -c "
              # 确保安装了 dmsquash-live 所需的包
              rpm -q dracut-live >/dev/null 2>&1 || dnf install -y dracut-live
              
              # 生成 Live initramfs (加 --stdlog 3 屏蔽写 /dev/kmsg 刷屏)
              dracut -f \
                     --no-hostonly \
                     --stdlog 3 \
                     --xz \
                     --add 'dmsquash-live lvm mdraid qemu dm' \
                     /out/initrd.img '${KERNEL_VERSION}'
            "
          
          
            

          echo "=== 4. 提取 UEFI 引导程序 (BOOTX64.EFI / grubx64.efi) ==="
          # 兼容不同发行版的 shim/grub 路径
          SHIM_PATH=$(find ${WORKDIR}/rootfs -name "shimx64.efi" 2>/dev/null | head -n 1)
          GRUB_PATH=$(find ${WORKDIR}/rootfs -name "grubx64.efi" 2>/dev/null | head -n 1)
          
          if [ -n "$SHIM_PATH" ]; then
            cp "$SHIM_PATH" ${WORKDIR}/iso/EFI/BOOT/BOOTX64.EFI
          fi
          if [ -n "$GRUB_PATH" ]; then
            cp "$GRUB_PATH" ${WORKDIR}/iso/EFI/BOOT/grubx64.efi
          fi

          echo "=== 5. 写入 GRUB 启动配置 (直入 Plasma 桌面) ==="
          cat << 'EOF' > ${WORKDIR}/iso/EFI/BOOT/grub.cfg
          set default="0"
          set timeout=5

          menuentry "Start AlmaLinux 10 Plasma Live" --class fedora --class gnu-linux --class gnu --class os {
              linux /isolinux/vmlinuz root=live:CDLABEL=ALMA_LIVE rd.live.image quiet rhgb splash
              initrd /isolinux/initrd.img
          }
          EOF

          echo "=== 6. 将 Rootfs 压缩为 SquashFS 镜像 ==="
          # 清理缓存文件以降低 ISO 体积
          sudo rm -rf ${WORKDIR}/rootfs/var/cache/* ${WORKDIR}/rootfs/tmp/*
          sudo mksquashfs ${WORKDIR}/rootfs ${WORKDIR}/iso/LiveOS/squashfs.img -comp zstd -Xcompression-level 15 -b 1M

          echo "=== 7. 使用 xorriso 封包生成纯 LiveCD ISO ==="
          xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -volid "ALMA_LIVE" \
            -eltorito-alt-boot \
            -e EFI/BOOT/BOOTX64.EFI \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            -output ./output/${{ env.IMAGE_NAME }}.iso \
            ${WORKDIR}/iso

          # 清理临时解压目录
          sudo rm -rf ${WORKDIR}
          ls -lh ./output/
      
      

      # =========================================================================
      # 4. 生成校验和并进行分卷切割 (处理大文件)
      # =========================================================================
      - name: Hash and Split ISO
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          cd output
          # 针对完整 ISO 计算 SHA256 校验和
          sha256sum "${{ env.IMAGE_NAME }}.iso" > "${{ env.IMAGE_NAME }}.iso.sha256"

          # 切割为 1.5GB 分卷，避免单文件过大导致 GitHub Release 传输断流
          split -b 1500M "${{ env.IMAGE_NAME }}.iso" "${{ env.IMAGE_NAME }}.iso.part-"
          ls -lh

      # =========================================================================
      # 5. 发布 ISO 分卷和校验文件至 GitHub Release
      # =========================================================================
      - name: Publish ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "LiveISO Release - ${{ steps.vars.outputs.tag }}"
          files: |
            output/${{ env.IMAGE_NAME }}.iso.part-*
            output/${{ env.IMAGE_NAME }}.iso.sha256
          body: |
            ## AlmaLinux 10 Plasma LiveCD 构建完成 (免安装直入桌面)

            ### 合并分卷命令 (Linux / macOS):
            ```bash
            cat ${{ env.IMAGE_NAME }}.iso.part-* >${{ env.IMAGE_NAME }}.iso
            sha256sum -c ${{ env.IMAGE_NAME }}.iso.sha256
            ```

            ### 合并分卷命令 (Windows PowerShell):
            ```powershell
            cmd /c copy /b ${{ env.IMAGE_NAME }}.iso.part-*${{ env.IMAGE_NAME }}.iso
            Get-FileHash ./${{ env.IMAGE_NAME }}.iso -Algorithm SHA256
            ```
          generate_release_notes: false

      # =========================================================================
      # 6. 将完整 ISO 作为 OCI Artifact (Blob) 推送到 GHCR 与 阿里云 ACR
      # =========================================================================
      - name: Push ISO Blob to GHCR & Aliyun ACR via ORAS
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_iso == true)
        run: |
          cd output
          
          echo "=== 1. 登录 ORAS 到 GHCR 与 阿里云 ACR ==="
          oras login ghcr.io -u "${{ env.ACTOR_LOWER }}" -p "${{ secrets.GITHUB_TOKEN }}"
          oras login "${{ secrets.ALIYUN_ACR_REGISTRY }}" -u "${{ secrets.ALIYUN_ACR_USERNAME }}" -p "${{ secrets.ALIYUN_ACR_PASSWORD }}"

          echo "=== 2. 推送 ISO Blob 到 GHCR ==="
          oras push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-iso:latest" \
            "${{ env.IMAGE_NAME }}.iso:application/x-iso9660-image" \
            "${{ env.IMAGE_NAME }}.iso.sha256:text/plain"

          oras push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-iso:${{ steps.vars.outputs.tag }}" \
            "${{ env.IMAGE_NAME }}.iso:application/x-iso9660-image" \
            "${{ env.IMAGE_NAME }}.iso.sha256:text/plain"

          echo "=== 3. 推送 ISO Blob 到 阿里云 ACR ==="
          oras push "${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}-iso:latest" \
            "${{ env.IMAGE_NAME }}.iso:application/x-iso9660-image" \
            "${{ env.IMAGE_NAME }}.iso.sha256:text/plain"

          oras push "${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ env.ACTOR_LOWER }}/${{ env.IMAGE_NAME }}-iso:${{ steps.vars.outputs.tag }}" \
            "${{ env.IMAGE_NAME }}.iso:application/x-iso9660-image" \
            "${{ env.IMAGE_NAME }}.iso.sha256:text/plain"
